<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Bible QSSE</title><link rel="manifest" href="manifest.webmanifest"><style>:root{--bg:#0b1220;--panel:#111827;--panel2:#1f2937;--line:#374151;--txt:#f3f4f6;--muted:#9ca3af;--gold:#e5b700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,sans-serif}header{height:78px;display:flex;align-items:center;gap:16px;padding:12px 20px;background:#101827;border-bottom:1px solid var(--line)}.logo{width:54px;height:54px;border-radius:14px;background:#0a0f18;display:grid;place-items:center;font-size:31px;border:1px solid #4b5563}h1{font-size:22px;margin:0}.sub{color:var(--muted);font-size:12px;margin-top:3px}.grow{flex:1}button{background:#273449;color:white;border:1px solid #46546a;border-radius:10px;padding:11px 14px;font-weight:700}input{background:#0d1524;border:1px solid #46546a;color:white;border-radius:10px;padding:11px;width:min(360px,36vw)}main{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 78px)}aside{background:var(--panel);padding:16px;border-right:1px solid var(--line);overflow:auto}.content{padding:20px;overflow:auto}.folder{display:block;width:100%;text-align:left;margin:7px 0;background:#1c2738}.folder strong{color:var(--gold)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px}.crumb{font-size:19px;font-weight:700;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px;min-height:92px;cursor:pointer}.type{font-size:12px;color:var(--gold);font-weight:700}.name{margin-top:8px;word-break:break-word}.meta{font-size:11px;color:var(--muted);margin-top:8px}.empty{padding:40px;color:var(--muted);text-align:center;border:1px dashed #46546a;border-radius:14px}.note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:16px}@media(max-width:760px){main{grid-template-columns:1fr}aside{display:none}input{width:38vw}.sub{display:none}}</style></head><body><header><div class="logo">☠</div><div><h1>BIBLE QSSE</h1><div class="sub">Bureau mobile • bibliothèque locale</div></div><div class="grow"></div><input id="search" placeholder="Rechercher un document…"><button id="choose">Choisir la Bible QSSE</button></header><main><aside><div style="font-weight:700;margin-bottom:10px">DOSSIERS</div><div id="tree"></div><div class="note">Les fichiers restent dans leur dossier d’origine. Rien n’est envoyé dans le cloud.</div></aside><section class="content"><div class="toolbar"><div class="crumb" id="crumb">Bible QSSE</div><button id="up">↑ Parent</button><button id="newFolder">+ Dossier</button></div><div class="grid" id="grid"></div></section></main><script>let rootHandle=null,currentHandle=null,history=[];const grid=document.querySelector('#grid'),tree=document.querySelector('#tree'),crumb=document.querySelector('#crumb');async function chooseRoot(){if(!('showDirectoryPicker'in window)){alert("Ce navigateur ne permet pas l’accès direct à un dossier. Essaie Chrome ou Edge.");return}try{rootHandle=await window.showDirectoryPicker({mode:'readwrite'});currentHandle=rootHandle;history=[];await renderRoot();await render(currentHandle)}catch(e){}}async function entries(dir){let a=[];for await(const[name,h]of dir.entries())a.push([name,h]);return a.sort((x,y)=>(x[1].kind===y[1].kind?x[0].localeCompare(y[0],'fr'):(x[1].kind==='directory'?-1:1)))}async function renderRoot(){tree.innerHTML='';if(!rootHandle)return;const home=document.createElement('button');home.className='folder';home.innerHTML='<strong>⌂</strong> '+rootHandle.name;home.onclick=async()=>{currentHandle=rootHandle;history=[];await render(currentHandle)};tree.appendChild(home);for(const[n,h]of await entries(rootHandle))if(h.kind==='directory'){const b=document.createElement('button');b.className='folder';b.textContent='▸ '+n;b.onclick=async()=>{history=[rootHandle];currentHandle=h;await render(h)};tree.appendChild(b)}}async function render(dir,filter=''){grid.innerHTML='';crumb.textContent=dir?.name||'Bible QSSE';if(!dir){grid.innerHTML='<div class="empty">Sélectionne ton dossier « Bible QSSE ».</div>';return}let arr=await entries(dir);if(filter)arr=arr.filter(([n])=>n.toLowerCase().includes(filter.toLowerCase()));if(!arr.length){grid.innerHTML='<div class="empty">Aucun document dans ce dossier.</div>';return}for(const[name,h]of arr){const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="type">${h.kind==='directory'?'DOSSIER':'DOCUMENT'}</div><div class="name">${name}</div><div class="meta">${h.kind==='directory'?'Ouvrir le dossier':'Ouvrir le fichier'}</div>`;c.onclick=async()=>{if(h.kind==='directory'){history.push(currentHandle);currentHandle=h;await render(h)}else{const f=await h.getFile();const url=URL.createObjectURL(f);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000)}};grid.appendChild(c)}}document.querySelector('#choose').onclick=chooseRoot;document.querySelector('#up').onclick=async()=>{if(history.length){currentHandle=history.pop();await render(currentHandle)}};document.querySelector('#newFolder').onclick=async()=>{if(!currentHandle)return;let n=prompt('Nom du nouveau dossier :');if(!n)return;try{await currentHandle.getDirectoryHandle(n,{create:true});await render(currentHandle);await renderRoot()}catch(e){alert('Création impossible.')}};document.querySelector('#search').addEventListener('input',e=>render(currentHandle,e.target.value));render(null);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
