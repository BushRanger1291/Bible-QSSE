<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Bible QSSE</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{font-family:Arial,sans-serif;color-scheme:dark;--bg:#0b1220;--panel:#111827;--card:#1f2937;--line:#374151;--text:#f3f4f6;--muted:#b6bfcc;--gold:#f4cf45}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer;background:#273449;color:var(--text);border:1px solid #526178;border-radius:10px;padding:10px 13px}button:hover,button:focus-visible,.card:hover,.card:focus-visible{border-color:var(--gold);outline:none}button:disabled{opacity:.45;cursor:not-allowed}header{display:flex;align-items:center;gap:13px;padding:13px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}.logo{width:48px;height:48px}h1{font-size:21px;margin:0}.subtitle,.hint,.meta{color:var(--muted);font-size:12px}.grow{flex:1}input{background:#0d1524;color:var(--text);border:1px solid #526178;border-radius:10px;padding:11px;min-width:190px}#search{width:min(350px,35vw)}main{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:calc(100dvh - 76px)}aside{padding:17px;background:var(--panel);border-right:1px solid var(--line);overflow:auto}.content{padding:20px;min-width:0}.folder{width:100%;display:block;text-align:left;margin:5px 0;overflow-wrap:anywhere}.folder.active{border-color:var(--gold)}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}.crumb{font-size:18px;font-weight:700;flex:1 1 240px;overflow-wrap:anywhere}.status{color:var(--muted);font-size:13px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.card{display:block;text-align:left;width:100%;min-height:104px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px}.type{font-size:12px;color:var(--gold);font-weight:700}.name{margin:8px 0;overflow-wrap:anywhere}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed #526178;border-radius:13px}.hint{line-height:1.5;margin:20px 0}#notice{min-height:1.5em;color:var(--gold)}#folderPanel{display:none}#folderPanel.open{display:block}@media(max-width:760px){header{padding:12px}#search{order:3;width:100%;flex:1 0 100%}main{display:block}.content{padding:14px}#folderPanel{position:static;border-bottom:1px solid var(--line)}.subtitle{display:none}}@media(min-width:761px){#folderPanel{display:block!important}#foldersToggle{display:none}}
  </style>
</head>
<body>
  <header><img class="logo" src="icon.svg" alt=""><div><h1>BIBLE QSSE</h1><div class="subtitle">Bibliothèque locale de documents</div></div><div class="grow"></div><input id="search" type="search" placeholder="Rechercher partout…" aria-label="Rechercher dans la Bible QSSE"><button id="choose" type="button">Choisir un dossier</button></header>
  <main><aside id="folderPanel"><strong>DOSSIERS</strong><nav id="tree" aria-label="Dossiers"></nav><p class="hint">Les documents restent sur cet appareil. L’application n’envoie aucun fichier.</p></aside><section class="content"><div class="toolbar"><button id="foldersToggle" type="button" aria-expanded="false" aria-controls="folderPanel">☰ Dossiers</button><div class="crumb" id="crumb">Bible QSSE</div><button id="up" type="button">↑ Parent</button><button id="newFolder" type="button">+ Dossier</button><button id="addFiles" type="button">+ Documents</button><input id="files" type="file" multiple hidden></div><div id="notice" role="status" aria-live="polite"></div><div class="status" id="status"></div><div class="grid" id="grid"></div></section></main>
  <script src="app.js" defer></script>
</body>
</html>
